apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
  namespace: flux-system
spec:
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.84.0
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
  targetNamespace: monitoring
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Operator bundles the VictoriaMetrics CRDs (plain manifests, applied by Flux SSA).
    victoria-metrics-operator:
      enabled: true
      crds:
        plain: true

    # Single-node TSDB. NodePort so the in-cluster Talos vmagent can remote_write
    # and we can reach it by IP even when DNS (pihole on Talos) is down.
    vmsingle:
      enabled: true
      spec:
        retentionPeriod: "12"        # months — VM is very space-efficient
        storage:
          accessModes:
            - ReadWriteOnce
          storageClassName: local-path
          resources:
            requests:
              storage: 30Gi
        serviceSpec:
          useAsDefault: true
          spec:
            type: NodePort
            ports:
              - name: http
                port: 8428
                targetPort: 8428
                protocol: TCP
                nodePort: 30428

    # Local scrape of the Pi/k3s itself (node-exporter, kube-state-metrics, kubelet).
    vmagent:
      enabled: true

    vmalert:
      enabled: true
      spec:
        extraArgs:
          # Base for alert GeneratorURL (chart appends explore?left=...); the
          # chart default derives it from a Grafana ingress we don't have.
          external.url: http://10.127.1.50:30300

    defaultRules:
      rules:
        # Upstream text assumes service-discovered targets; static scrapes
        # (synology, coreelec, ...) have no service/namespace labels.
        TargetDown:
          spec:
            annotations:
              summary: '{{ $labels.job }} is unreachable'
              description: '{{ printf "%.4g" $value }}% of {{ $labels.job }} targets are down{{ if $labels.namespace }} ({{ $labels.namespace }}/{{ $labels.service }}){{ end }}.'

    # k3s runs scheduler/controller-manager in one binary with no separate
    # scrape endpoints, and uses kine instead of etcd — disabling these drops
    # the empty scrape pools and their always-firing rules.
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false

    alertmanager:
      enabled: true
      spec:
        # Mounted at /etc/vm/secrets/alertmanager-telegram/ (bot_token, chat_id).
        secrets:
          - alertmanager-telegram
      config:
        route:
          receiver: telegram
          group_by: ["alertname", "job"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            - receiver: blackhole
              matchers:
                - alertname=~"Watchdog|InfoInhibitor"
            - receiver: blackhole
              matchers:
                - severity="info"
        inhibit_rules:
          - source_matchers:
              - severity="critical"
            target_matchers:
              - severity="warning"
            equal: ["alertname", "job"]
        receivers:
          - name: blackhole
          - name: telegram
            telegram_configs:
              - bot_token_file: /etc/vm/secrets/alertmanager-telegram/bot_token
                chat_id_file: /etc/vm/secrets/alertmanager-telegram/chat_id
                send_resolved: true
                parse_mode: HTML
                message: '{{ template "telegram.homelab.message" . }}'
      # One block per alert: name, summary, labels, Kyiv time, links.
      templateFiles:
        telegram.tmpl: |
          {{ define "telegram.homelab.alert" -}}
          {{ if eq .Status "resolved" }}✅{{ else if eq .Labels.severity "critical" }}🔴{{ else }}🟠{{ end }} <b>{{ .Labels.alertname | html }}</b>{{ if eq .Status "resolved" }} — resolved{{ end }}
          {{- if eq .Status "firing" }}{{ with .Annotations.summary }}
          {{ . | html }}{{ end }}{{ end }}
          {{- if eq .Status "firing" }}{{ with .Annotations.description }}
          <i>{{ . | html }}</i>{{ end }}{{ end }}
          {{- $labels := "" }}
          {{- range .Labels.SortedPairs }}{{ if not (match "^(alertname|severity|prometheus|alertgroup|endpoint|container)$" .Name) }}
          {{- $labels = printf "%s%s=%s " $labels .Name .Value }}{{ end }}{{ end }}
          {{- with trimSpace $labels }}
          🎯 <code>{{ . | html }}</code>{{ end }}
          🕒 {{ .StartsAt | tz "Europe/Kyiv" | date "15:04 02.01" }}
          {{- if eq .Status "resolved" }} → {{ .EndsAt | tz "Europe/Kyiv" | date "15:04" }} ({{ (.EndsAt.Sub .StartsAt).Seconds | humanizeDuration }}){{ end }}
          {{- if eq .Status "firing" }}
          {{- $links := "" }}
          {{- with .GeneratorURL }}{{ $links = printf "<a href=\"%s\">query</a>" (. | html) }}{{ end }}
          {{- with .Annotations.dashboard }}{{ $links = printf "%s · <a href=\"%s\">dashboard</a>" $links (. | html) }}{{ end }}
          {{- with .Annotations.runbook_url }}{{ $links = printf "%s · <a href=\"%s\">runbook</a>" $links (. | html) }}{{ end }}
          {{- with $links }}
          🔗 {{ . }}{{ end }}
          {{- end }}
          {{- end }}

          {{ define "telegram.homelab.message" -}}
          {{ range $i, $a := .Alerts.Firing }}{{ if $i }}

          {{ end }}{{ template "telegram.homelab.alert" $a }}{{ end }}
          {{- if and .Alerts.Firing .Alerts.Resolved }}

          {{ end }}
          {{- range $i, $a := .Alerts.Resolved }}{{ if $i }}

          {{ end }}{{ template "telegram.homelab.alert" $a }}{{ end }}
          {{- end }}

    grafana:
      enabled: true
      # SQLite DB on an RWO local-path volume — never run two pods at once.
      deploymentStrategy:
        type: Recreate
      # The volume already carries fsGroup: 472 and 472-owned data; the chown
      # init container drops DAC_OVERRIDE and can't traverse Grafana's 0700
      # render dirs, so it's both redundant and breaks rollouts here.
      initChownData:
        enabled: false
      # Native VictoriaMetrics datasource plugins (signed, from Grafana catalog).
      # - metrics: backs the "VictoriaMetrics (DS)" datasource the chart
      #   provisions by default (defaultDatasources.victoriametrics) — MetricsQL.
      # - logs: backs our VictoriaLogs datasource (configmap-logs-datasource.yaml).
      plugins:
        - victoriametrics-metrics-datasource
        - victoriametrics-logs-datasource
      # Native Grafana login — independent of Authelia (which lives in Talos).
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        type: pvc
        storageClassName: local-path
        size: 5Gi
      # NodePort so Grafana is reachable by IP without depending on DNS.
      service:
        type: NodePort
        nodePort: 30300
