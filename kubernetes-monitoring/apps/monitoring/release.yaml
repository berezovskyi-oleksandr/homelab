apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
  namespace: flux-system
spec:
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.84.0
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
  targetNamespace: monitoring
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    # Flux skips CRD updates on upgrade by default; chart bumps carry new CRDs.
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Operator bundles the VictoriaMetrics CRDs (plain manifests, applied by Flux SSA).
    victoria-metrics-operator:
      enabled: true
      crds:
        plain: true

    # Single-node TSDB. NodePort so the in-cluster Talos vmagent can remote_write
    # and we can reach it by IP even when DNS (pihole on Talos) is down.
    vmsingle:
      enabled: true
      spec:
        retentionPeriod: "12"        # months — VM is very space-efficient
        # Operator default limit is 1500Mi; it sat at ~1.2Gi with Pi-only series
        # and Talos remote_write adds ~55% more.
        resources:
          requests:
            cpu: 150m
            memory: 1Gi
          limits:
            memory: 3Gi
        storage:
          accessModes:
            - ReadWriteOnce
          storageClassName: local-path
          resources:
            requests:
              storage: 30Gi
        serviceSpec:
          useAsDefault: true
          spec:
            type: NodePort
            ports:
              - name: http
                port: 8428
                targetPort: 8428
                protocol: TCP
                nodePort: 30428

    # Local scrape of the Pi/k3s itself (node-exporter, kube-state-metrics, kubelet).
    # Talos remote-writes its own series here with cluster=talos
    # (kubernetes/infrastructure/controllers/victoria-metrics-agent/).
    vmagent:
      enabled: true
      spec:
        externalLabels:
          cluster: rpi

    vmalert:
      enabled: true
      spec:
        extraArgs:
          # Base for alert GeneratorURL (chart appends explore?left=...); the
          # chart default derives it from a Grafana ingress we don't have.
          external.url: http://10.127.1.50:30300

    defaultRules:
      rules:
        # Upstream text assumes service-discovered targets; static scrapes
        # (synology, coreelec, ...) have no service/namespace labels.
        TargetDown:
          spec:
            annotations:
              summary: '{{ $labels.job }} is unreachable'
              description: '{{ printf "%.4g" $value }}% of {{ $labels.job }} targets are down{{ if $labels.namespace }} ({{ $labels.namespace }}/{{ $labels.service }}){{ end }}.'
        # Talos load is dominated by tasks blocked on NFS IO (qBittorrent,
        # Synology scrubs), not CPU: load/core > 2 at ~30% CPU. Talos gets a
        # CPU-PSI rule in vmrule-homelab.yaml instead.
        NodeSystemSaturation:
          spec:
            expr: (node_load1{job="node-exporter",cluster!="talos"} / count(node_cpu_seconds_total{job="node-exporter",mode="idle",cluster!="talos"}) without(cpu,mode)) > 2

    # k3s runs scheduler/controller-manager in one binary with no separate
    # scrape endpoints, and uses kine instead of etcd — disabling these drops
    # the empty scrape pools and their always-firing rules.
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false

    alertmanager:
      enabled: true
      spec:
        # Mounted at /etc/vm/secrets/alertmanager-telegram/ (bot_token, chat_id).
        secrets:
          - alertmanager-telegram
        # The Pi's resolver is pihole on Talos: with Talos down, api.telegram.org
        # wouldn't resolve and the "Talos is down" alert could never be sent.
        # Single replica (no gossip), so no cluster DNS needed.
        dnsPolicy: None
        dnsConfig:
          nameservers:
            - 10.127.1.1
      config:
        route:
          receiver: telegram
          group_by: ["alertname", "cluster", "job"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            - receiver: blackhole
              matchers:
                - alertname=~"Watchdog|InfoInhibitor"
            - receiver: blackhole
              matchers:
                - severity="info"
        inhibit_rules:
          - source_matchers:
              - severity="critical"
            target_matchers:
              - severity="warning"
            equal: ["alertname", "cluster", "job"]
          # WAN/hairpin/Traefik down: one aggregate alert instead of one per host.
          - source_matchers:
              - alertname="PublicIngressDown"
            target_matchers:
              - alertname="ProbeDown"
            equal: ["job"]
          # Talos stopped sending metrics: its absent()-based alerts are noise.
          - source_matchers:
              - alertname="TalosMetricsMissing"
            target_matchers:
              - cluster="talos"
              - alertname!="TalosMetricsMissing"
        receivers:
          - name: blackhole
          - name: telegram
            telegram_configs:
              - bot_token_file: /etc/vm/secrets/alertmanager-telegram/bot_token
                chat_id_file: /etc/vm/secrets/alertmanager-telegram/chat_id
                send_resolved: true
                parse_mode: HTML
                message: '{{ template "telegram.homelab.message" . }}'
      # Slack-only; its ConfigMap name collides with extra-tpl once the operator
      # truncates volume names to 63 chars ("duplicate Volume.Name").
      monzoTemplate:
        enabled: false
      # One block per alert: name, summary, labels, Kyiv time, links.
      templateFiles:
        telegram.tmpl: |
          {{ define "telegram.homelab.alert" -}}
          {{ if eq .Status "resolved" }}✅{{ else if eq .Labels.severity "critical" }}🔴{{ else }}🟠{{ end }} <b>{{ .Labels.alertname | html }}</b>{{ if eq .Status "resolved" }} — resolved{{ end }}
          {{- if eq .Status "firing" }}{{ with .Annotations.summary }}
          {{ . | html }}{{ end }}{{ end }}
          {{- if eq .Status "firing" }}{{ with .Annotations.description }}
          <i>{{ . | html }}</i>{{ end }}{{ end }}
          {{- $labels := "" }}
          {{- range .Labels.SortedPairs }}{{ if not (match "^(alertname|severity|prometheus|alertgroup|endpoint|container)$" .Name) }}
          {{- $labels = printf "%s%s=%s " $labels .Name .Value }}{{ end }}{{ end }}
          {{- with trimSpace $labels }}
          🎯 <code>{{ . | html }}</code>{{ end }}
          🕒 {{ .StartsAt | tz "Europe/Kyiv" | date "15:04 02.01" }}
          {{- if eq .Status "resolved" }} → {{ .EndsAt | tz "Europe/Kyiv" | date "15:04" }} ({{ (.EndsAt.Sub .StartsAt).Seconds | humanizeDuration }}){{ end }}
          {{- /* parse_mode HTML makes AM use html/template: tags must be literal template text, values get auto-escaped. */}}
          {{- if and (eq .Status "firing") .GeneratorURL }}
          🔗 <a href="{{ .GeneratorURL }}">query</a>
          {{- with .Annotations.dashboard }} · <a href="{{ . }}">dashboard</a>{{ end }}
          {{- with .Annotations.runbook_url }} · <a href="{{ . }}">runbook</a>{{ end }}
          {{- end }}
          {{- end }}

          {{ define "telegram.homelab.short" -}}
          {{ if eq .Status "resolved" }}✅{{ else if eq .Labels.severity "critical" }}🔴{{ else }}🟠{{ end }} <code>{{ with .Labels.namespace }}{{ . | html }}/{{ end }}{{ with .Labels.pod }}{{ . | html }}{{ else }}{{ with .Labels.name }}{{ . | html }}{{ else }}{{ .Labels.instance | html }}{{ end }}{{ end }}</code>
          {{- end }}

          {{- /* Telegram caps messages at 4096 chars and AM then sends only a
               placeholder, so groups of >3 get one line per alert, capped at 40. */}}
          {{ define "telegram.homelab.compact" -}}
          <b>{{ .CommonLabels.alertname | html }}</b>{{ with .CommonLabels.cluster }} · {{ . | html }}{{ end }}
          {{- with .Alerts.Firing }}
          🔥 {{ len . }} firing{{ range $i, $a := . }}{{ if lt $i 40 }}
          {{ template "telegram.homelab.short" $a }}{{ end }}{{ end }}{{ if gt (len .) 40 }}
          …{{ end }}{{ end }}
          {{- with .Alerts.Resolved }}
          ✅ {{ len . }} resolved{{ range $i, $a := . }}{{ if lt $i 20 }}
          {{ template "telegram.homelab.short" $a }}{{ end }}{{ end }}{{ if gt (len .) 20 }}
          …{{ end }}{{ end }}
          {{- end }}

          {{ define "telegram.homelab.message" -}}
          {{ if gt (len .Alerts) 3 }}{{ template "telegram.homelab.compact" . }}{{ else -}}
          {{ range $i, $a := .Alerts.Firing }}{{ if $i }}

          {{ end }}{{ template "telegram.homelab.alert" $a }}{{ end }}
          {{- if and .Alerts.Firing .Alerts.Resolved }}

          {{ end }}
          {{- range $i, $a := .Alerts.Resolved }}{{ if $i }}

          {{ end }}{{ template "telegram.homelab.alert" $a }}{{ end }}
          {{- end }}
          {{- end }}

    grafana:
      enabled: true
      # SQLite DB on an RWO local-path volume — never run two pods at once.
      deploymentStrategy:
        type: Recreate
      # The volume already carries fsGroup: 472 and 472-owned data; the chown
      # init container drops DAC_OVERRIDE and can't traverse Grafana's 0700
      # render dirs, so it's both redundant and breaks rollouts here.
      initChownData:
        enabled: false
      # Pi (cluster=rpi) and Talos (cluster=talos) share vmsingle: show the
      # cluster picker instead of mixing both in every panel.
      sidecar:
        dashboards:
          multicluster: true
      # Native VictoriaMetrics datasource plugins (signed, from Grafana catalog).
      # - metrics: backs the "VictoriaMetrics (DS)" datasource the chart
      #   provisions by default (defaultDatasources.victoriametrics) — MetricsQL.
      # - logs: backs our VictoriaLogs datasource (configmap-logs-datasource.yaml).
      plugins:
        - victoriametrics-metrics-datasource
        - victoriametrics-logs-datasource
      # Native Grafana login — independent of Authelia (which lives in Talos).
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        type: pvc
        storageClassName: local-path
        size: 5Gi
      # NodePort so Grafana is reachable by IP without depending on DNS.
      service:
        type: NodePort
        nodePort: 30300
