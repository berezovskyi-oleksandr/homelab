apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: homelab
  namespace: monitoring
spec:
  groups:
    - name: unifi-gateway
      rules:
        # Baseline load is 2–5; the 2026-09-26 memory-pressure incident sat at 15–25.
        - alert: UnifiGatewayHighLoad
          expr: avg_over_time(unpoller_device_load_average_1{type="udm"}[15m]) > 10
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "UniFi gateway load is {{ $value | humanize }} (15m avg)"
        # Baseline is 84–92% and creeps up ~1%/3 days until something restarts.
        - alert: UnifiGatewayMemoryHigh
          expr: avg_over_time(unpoller_device_memory_utilization_ratio{type="udm"}[30m]) > 0.93
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "UniFi gateway memory at {{ $value | humanizePercentage }} (30m avg)"
    - name: victoria-logs
      rules:
        # The gateway alone logs DHCP chatter every few minutes, so zero rows
        # means the syslog path is broken (e.g. the 2026-09-22 IP change).
        - alert: SyslogIngestionStalled
          expr: sum(rate(vl_rows_ingested_total{type="syslog_udp"}[30m])) == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "VictoriaLogs has received no syslog for 45m"
    - name: talos
      rules:
        # Talos ships everything via its own vmagent (remote_write to vmsingle
        # :30428). If that stops, every Talos KSM/kubelet rule silently goes
        # quiet; the chart's Watchdog runs on the Pi and can't notice.
        # Fires (~4m) before Talos alerts' 5m windows run dry, so the inhibit in
        # release.yaml is active before AM would send bogus "resolved" messages.
        - alert: TalosMetricsMissing
          expr: absent_over_time(up{cluster="talos"}[2m])
          for: 2m
          labels:
            severity: critical
            cluster: talos
          annotations:
            summary: "No metrics from Talos for 4m"
            description: "vmagent in Talos ns monitoring is down, or remote_write to 10.127.1.50:30428 is failing — or the whole node is down."
        # The chart's KubeAPIDown is absent(up{job="apiserver"}) without a
        # cluster split, so the Pi's own apiserver keeps it quiet forever.
        - alert: TalosAPIServerDown
          expr: absent(up{cluster="talos",job="apiserver"} == 1)
          for: 10m
          labels:
            severity: critical
            cluster: talos
          annotations:
            summary: "Talos kube-apiserver is unreachable from vmagent"
        # Stands in for NodeSystemSaturation (disabled for Talos: NFS IO wait
        # inflates load). Share of time some runnable task waits for a CPU.
        - alert: TalosCPUPressure
          expr: rate(node_pressure_cpu_waiting_seconds_total{cluster="talos",job="node-exporter"}[5m]) > 0.5
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Talos CPU pressure at {{ $value | humanizePercentage }} for 30m"
        # gotk_resource_info comes from Talos kube-state-metrics custom-resource-state.
        # Explicit states only: OCI HelmRepositories never get a Ready condition
        # (no `ready` label), and `!="True"` would match them forever.
        - alert: FluxResourceNotReady
          expr: max by (cluster, customresource_kind, exported_namespace, name) (gotk_resource_info{ready=~"False|Unknown", suspended!="true"}) > 0
          for: 20m
          labels:
            severity: warning
          annotations:
            summary: "Flux {{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} is not Ready"
            description: "Check `flux get all -A --status-selector ready=false` and `flux events`."
