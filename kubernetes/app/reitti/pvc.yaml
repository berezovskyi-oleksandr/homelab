apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reitti-data
  namespace: reitti
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-synology-ssd
  resources:
    requests:
      storage: 10Gi
---
# Map tile cache — recreatable, not backed up. nginx caps it at 2g tiles + 1g Panoramax.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reitti-tile-cache
  namespace: reitti
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-synology-ssd
  resources:
    requests:
      storage: 5Gi
