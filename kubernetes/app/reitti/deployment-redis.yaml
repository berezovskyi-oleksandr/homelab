apiVersion: apps/v1
kind: Deployment
metadata:
  name: reitti-redis
  namespace: reitti
  labels:
    app: reitti-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: reitti-redis
  template:
    metadata:
      labels:
        app: reitti-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999    # redis user in the alpine image
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4.11-alpine
          imagePullPolicy: IfNotPresent
          # Cache only — no persistence, so no PVC.
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          emptyDir: {}
